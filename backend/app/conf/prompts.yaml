  题材标签：{genres}

  【角色卡】（作品已设定的人物/势力/功法 —— 概要中只能使用这些既有角色，禁止发明新角色名/新势力/新功法）
  {character_cards}

  【作品简介】
  {description}

  【故事背景】
  {story_background}

  【故事线】（剧情发展路线设定）
  {plot_development}

  【已有章节概要】（前文脉络，按章节顺序）
  {existing_outlines}

  【后续剧情大框】（用户指定的后续剧情范围 —— 这是唯一剧情边界！）
  {story_direction}

  【任务】
  {task_desc}
  硬性要求：以下 {chapter_count} 章概要必须全部发生在大框所述情节之内。大框没提到的情节一律禁止出现；
  大框提到的每个关键点（事件/冲突/转折/人物/地点）都要安排进概要中，可在其范围内细化过程，但不得超出。
  输出 JSON 数组，长度严格为 {chapter_count}。

# ============================================================
# 十三、分镜脚本 —— 将小说章节转换为影视分镜头脚本
# ============================================================

SCREENPLAY_SYSTEM_PROMPT: |-
  你是专业的影视分镜编剧，擅长将小说章节内容改编为专业的分镜头脚本（故事板）格式。
  你熟悉影视分镜规范，包括分镜编号、景别、运镜、画面描述、对白、音效、转场等元素。
  你对AI生图提示词有深入理解，能为每个镜头生成高质量的中文提示词。
  请严格按照分镜头脚本格式输出，不要添加小说式的叙述性文字。

GENERATE_SCREENPLAY_DIRECTION: |
  
  # 任务：将小说章节内容转换为分镜头脚本
  
  请根据以下小说章节内容，将其改编为专业的分镜头脚本（故事板）格式，可直接用于影视拍摄。
  
  ## 作品设定
  {novel_settings}
  
  ## 小说章节内容
  以下是用 --- 分隔的不同章节内容：
  
  {chapters_content}
  
  ## 分镜头脚本格式要求
  
  请严格按照以下格式输出（每个场景包含场景描述 + 多个镜头）：
  
  ```
  场景一：【场景名称/地点】-【时间，如：日/夜】
  情感基调：【该场景的情感氛围】
  场景描述：【用简洁文字描述场景环境、氛围、光线等】
  
  镜头1  【景别】  【预估时长】
  画面描述：【用1-2句话描述画面构图、人物位置、动作、光线等视觉内容】
  运镜/拍摄方式：【推/拉/摇/移/跟/升/降/固定/手持/航拍等】-【运镜方向/速度说明】
  【角色名】（语气/情绪）对白内容
  字幕：【对白字幕内容】
  AI生图提示词：【中文提示词，描述该镜头关键视觉要素，可直接用于AI绘画生成】
  音效/背景音乐：【环境音/特效音/BGM说明】
  转场：【切/淡入/淡出/溶解/划像/黑场/白场/无转场等】
  
  镜头2  【景别】  【预估时长】
  画面描述：
  运镜/拍摄方式：
  （动作描述/无对白）
  AI生图提示词：
  音效/背景音乐：
  转场：
  ---
  场景二：【场景名称/地点】-【时间】
  情感基调：【该场景的情感氛围】
  场景描述：【】
  ...
  ```
  
  ## 专业术语说明
  
  ### 景别（必填）
  - **远景**：表现广阔场景、环境全貌
  - **全景**：展现人物全身及周围环境
  - **中景**：人物膝盖以上，兼顾动作和表情
  - **近景**：人物胸部以上，突出表情和情绪
  - **特写**：局部细节（面部、手部、道具等）
  - **过肩镜头**：越过一人肩膀拍摄对话对象
  - **主观镜头**：角色视角所见
  
  ### 运镜/拍摄方式（必填）
  - **固定镜头**：摄像机不动
  - **推**：镜头逐渐靠近主体，增强紧张感或关注度
  - **拉**：镜头逐渐远离主体，展现环境全貌
  - **摇**：摄像机原地旋转，展示环境或跟随运动
  - **移**：摄像机横向移动，平行跟随主体
  - **跟**：摄像机跟随主体移动
  - **升/降**：摄像机垂直升降
  - **手持**：晃动感，增强真实感和紧张感
  - **斯坦尼康**：稳定跟随，流畅运动
  - **航拍**：高空俯瞰
  
  ### 转场方式（必填）
  - **切**：直接切换，干净利落
  - **淡入**：从黑场逐渐显现画面
  - **淡出**：画面逐渐变为黑场
  - **溶解**：前一画面逐渐淡出同时后一画面淡入
  - **划像**：画面以某种形状划出/划入
  - **匹配剪辑**：利用相似构图/动作进行转场
  
  ## 转换规则
  1. **场景划分**：根据小说内容中的地点变化、时间跳转自然划分场景，每个场景独立编号
  2. **场景标题**：包含地点和时间（日/夜），用【】括起来
  3. **情感基调**：每场戏标注核心情感氛围（如：紧张压抑/温馨治愈/悬疑诡谲/悲壮肃穆等）
  4. **分镜拆分**：每个场景拆分为多个镜头，每个镜头一个编号
  5. **景别标注**：每个镜头必须标注景别，根据叙事需要交替使用不同景别
  6. **画面描述**：用1-2句话描述画面构图、人物位置和动作、光线氛围等核心视觉元素
  7. **运镜设计**：根据叙事节奏和情感需要设计合适的运镜方式
  8. **对白/配音**：保留原文关键对白，标注说话人的语气情绪；旁白/内心独白标注为【画外音】
  9. **字幕**：对白内容同步作为字幕输出，便于后期制作
  10. **AI生图提示词**：每个镜头生成一句话中文提示词，包含场景、角色、动作、光线、氛围等核心视觉要素，可直接用于AI图像生成
  11. **时长估算**：每个镜头估算合理的播放时长（单位：秒），对话镜头约5-15秒，动作镜头约3-8秒，空镜约3-5秒
  12. **音效/BGM**：标注环境音、特效音或背景音乐建议
  13. **转场**：每个镜头结尾标注转场方式
  14. **保留核心剧情**：保留原文的所有关键剧情、对话、冲突、情感转折
  15. **精简描述**：将小说中冗长的心理描写、环境渲染精简为镜头画面描述和动作指示
  16. **角色标注**：所有出现的角色名统一、清晰
  
  ## 输出要求
  - 只输出分镜头脚本内容，不要添加任何解释性文字
  - 脚本开头添加标题行：分镜头脚本：《{novel_title}》（第X-X章）
  - 每个场景用 --- 分隔
  - 每个场景先标注场景标题和情感基调，再列出该场景的所有镜头
  - 总长度控制在合理范围内，确保完整覆盖所有章节内容

# ============================================================
# 十四、续写模块 —— 基于记忆体与已写内容续写新章节
# ============================================================

# 疯批主角续写专属规则（无占位符，直接作为整段文本插入续写 Prompt；
# 内容与 chapter_service.continue_with_ai 原内联版本逐字节一致）
CONTINUE_CHAOT_RULES: |-
  【🔴 疯批主角 续写专属规则（本章主角命中疯/疯批/偏执/嘴贱/反骨等关键词，强制）】
  1. 台词不配合不礼貌：权威/高位者（神明/观众/上级/审判者/观测员）说话时，至少一次打断/反问/抬杠/答非所问，禁止恭敬回应；
  2. 行为反套路：规则让他做的事至少一次不乖乖照做（或问一句「凭什么」），实力不够时做小动作拆台；
  3. 怼神/怼观众：若出现神明/观测员/直播间/弹幕/观礼台，至少一次正面怼（反抗/反问/羞辱/无视四选一），示例台词参考：
     「你让我往东我就往东？你谁啊？你说句'请'。」「你们看了三百年不腻？你们站里有食堂吗？」「演？我不是你们的戏子。」「掉就掉呗，你们不还在看吗？」；
  4. 直播间互动：设定有弹幕时，至少一次主角对弹幕的反应（吐槽/无视/骂回去/对着空气说风凉话）；
  5. 清醒的疯：每一次「疯行」背后都有目的/算计/要保护的人，禁止真的脑子有病；碰到人设规定的底线（如家人/恩人）立刻安静，反差是爽点。

# 续写主 Prompt（{protagonist_block}/{chaot_rules}/{memory_body}/{chapter_name}/{chapter_summary}/{context_content}/{word_count}/{min_words} 由代码填充；
# 内容与 chapter_service.continue_with_ai 原内联版本逐字节一致）
CONTINUE_PROMPT: |-
  你是在续写这部小说。请根据记忆体和已写内容，续写出高质量、生动、字数充足的小说内容。

  {protagonist_block}
  {chaot_rules}

  【作品记忆体】（必须严格遵循的人物、事件、世界观）
  {memory_body}

  【本章信息】
  章节名称：{chapter_name}
  本章概要：{chapter_summary}
  当前已写内容（末尾，必须紧密衔接）：
  {context_content}

  【🔴 续写核心要求 —— 每条都必须做到，违反即作废】

  一、字数硬性要求：续写 {word_count} 字左右，绝对不能少于 {min_words} 字！
     - 不是水字数，是每个场景/事件都要展开200-500字的生动描写
     - 一句话带过 = 不及格！每个事件必须有场景入场、动作细节、对话潜台词、五感描写、内心活动

  二、人物塑造：对话要有性格辨识度，用动作/神态/心理活动展示人物特征
     - 每句对话配合微表情和肢体语言："没事。"她低头看着手指，尾音颤了一下
     - 嘴里说的≠心里想的，要有潜台词

  三、场景环境：用五感（视觉/听觉/嗅觉/触觉/本体觉）渲染场景，让读者有画面感
     - 每个场景至少调动2种感官：火光在墙上跳了一下（视觉）、柴火噼啪响（听觉）、药味很浓（嗅觉）、手指碰到碗壁烫了一下（触觉）

  四、情感描写：写出角色内心感受和情绪变化，用自由间接引语融入叙述
     - 不用"他想""她觉得"，直接写内心：碗里的粥凉了。凉了也好。凉的喝下去慢，能多坐一会儿
     - 情绪落到身体：心跳、呼吸、手心、膝盖、嗓子、后背

  五、情绪氛围：营造适合当前剧情的氛围，长短句交替控制节奏
     - 紧张场景用短句：他退了一步。又退了一步。背抵住墙。
     - 舒缓场景用长句：她把针线活收进笸箩里，顺手抹了把额头的汗，窗外的日头已经偏了
     - 对话之间穿插动作和环境，不要连续5句以上纯对话

  六、剧情张力：有冲突或事件推进，铺垫→冲突→转折→余韵

  七、内容丰富：每段都推进剧情或塑造人物，对话与叙述比例约 3:7

  八、【🔴 设定至上 —— 续写也必须严格遵守】
     1. 角色独立性：设定中每个角色都是独立个体，禁止合并角色（把 A 的外貌 + B 的能力揉成一个人）。
     2. 禁止发明设定：设定文件中没有的力量体系/概念/术语/组织，一律不得出现在续写中。
     3. 地名/道具名以设定为准：设定里叫什么就写什么，禁止改名；设定列出的随身物品不得遗漏。
     4. 简介承诺必须兑现：简介中描述的关键场景/台词，续写中对应场景必须按简介呈现。
     5. 设定 vs 记忆体冲突时以设定为准。

  只输出续写内容，不要重复已有文字，不要加标题。直接从续写的第一句开始。

