# 完整提取（{novel_genre}/{content} 由代码填充）
FULL_EXTRACT_PROMPT: |-
  你是一位资深小说编辑，正在为一部{novel_genre}的记忆体系统提取本章节的完整信息。你需要像写一份详细的章节分析报告一样，把本章所有重要内容都记录下来。宁可多写也不要遗漏！

  请按以下格式输出，每个 ---分隔区域--- 都不能省略：

  ---人物---
  格式：姓名|身份|性格|当前状态|修为
  要求：本章出现的每一个有名有姓的角色都列出来！即使是配角、只提了一句的路人、回忆中的人物，只要有名有姓就写。如果本章没有任何新角色才写「无」。
  示例：
  顾平安|散修|坚韧隐忍|练气三层突破中|练气三层
  白胡子|散修老头|随性贪酒神秘|正在喝酒|练气九层

  ---组织/势力---
  格式：名称|性质|成员规模|当前动向
  要求：本章提及的所有宗门、门派、帮会、家族等组织都要列出。本章未提及任何组织才写「无」。
  示例：
  青云宗|正道宗门|弟子约3000人|正追查魔教余孽

  ---功法/技能/法宝---
  格式：名称|效果描述|使用者/归属|来源
  要求：本章出现（使用、被提及、被获得）的任何功法、技能、法术、法宝、体质、血脉等，全部列出。注意区分技能名称和效果描述。本意无相关内容才写「无」。
  示例：
  圣灵仙体|天生克制一切邪祟，体质纯净如初雪|江黎|天生

  ---关键事件---
  要求：这是最重要的维度！请像写故事大纲一样，按时间顺序用序号列出本章发生的每一个重要事件。不要合并！不要省略！写的越细越好！

  需要包含的事件类型：
  - 战斗场面（谁 vs 谁、过程、结果）
  - 突破/晋级
  - 新角色登场
  - 重要对话/揭示秘密/信息传递
  - 获得/失去物品
  - 到达/离开重要地点
  - 角色做出重大决定
  - 环境/天象的异常变化
  - 角色之间的情感变化
  - 任何推动剧情发展的节点

  格式：每件事件单独一行，用数字序号开头，描述尽量详细完整。
  若本章确实没有任何事件才写「无」。
  示例：
  1. 顾平安在破庙醒来，发现自己躺在硬木板床上，身上盖着打着补丁的被子。
  2. 白胡子老头推门进来，自称叫"白胡子"，问顾平安的名字。
  3. 白胡子端来一碗热粥和一碟咸菜，顾平安狼吞虎咽地吃完。
  4. 白胡子告诉顾平安，他的伤是被铁甲熊打的，自己路过救了他。
  5. 顾平安注意到白胡子腰间的葫芦里飘出淡淡酒香，心中对他产生一丝信任。

  ---地点---
  格式：地名|特征描述|发生了什么
  要求：本章出现（或被提及）的每一个有名字的地点都要列出！包括场景内不同区域。本章确实无新地点才写「无」。
  示例：
  落空城|东域灵脉交汇之城，城墙由九天玄铁铸就|顾平安出生之地
  破庙|破败不堪，有院子、枣树|顾平安醒来之地

  ---时间线---
  格式：时间节点|发生了什么事
  要求：列出本章所有时间标记——清晨/中午/傍晚/深夜、几天前/后、几个月前/后等。注意：一章内可能有多个时间节点！本章确无时间信息才写「无」。
  示例：
  清晨|顾平安醒来，白胡子端来粥
  深夜|顾平安趁老头睡着后悄悄练功

  ---关键物品---
  格式：物品名|功能效果|归属/发现者
  要求：本章出现（或提及）的任何有特殊意义的物品——法宝、丹药、材料、信物、灵物等都要列出。普通日常物品（粥、碗、被子、石头等）不需要。本章确无关键物品才写「无」。
  示例：
  大蛇肉|蕴含大量灵力，吃了能加速修炼|顾平安从死蛇身上割下

  ---实力变化---
  格式：角色名|变化前→变化后|原因
  要求：本章中任何角色的修为、实力、境界发生了变化都要列出。本章确无变化才写「无」。
  示例：
  顾平安|练气一层→练气三层|吃了大蛇肉+修炼淬仙诀

  ---伏笔/悬念---
  格式：描述未解之谜或暗示的信息
  要求：本章留下的所有疑问、悬念、坑、未来可能发展的线索都要列出。这是给续写 AI 用的，越详细越好！包括反常现象、未解释的行为、神秘物品的来历等。本章确无伏笔才写「无」。
  示例：
  1. 白胡子为何恰好出现在顾平安面前？他说"路过"，但真的是偶然吗？
  2. 顾平安额头的金色印记是什么？为什么会在危险时发光？
  3. 石壁上的淬仙诀是谁留下的？为什么恰好适合顾平安修炼？

  === 本章内容 ===
  {content}

  请开始全面提取，记住：关键事件必须逐件列出，不要跳过任何一件事情！

# 记忆体聚合（{settings}/{chapters_summary} 由代码填充）
AGGREGATE_MEMORY_PROMPT: |-
  你是一位资深小说编辑。以下是从小说第1章到最后一章逐章提取的关键信息汇总。

  请根据以下汇总和作品设定，整理出完整的小说记忆体，按10个维度输出。每条信息标注来源章节。宁可详细也不可遗漏：

  1.【人物】每个角色单独一行，格式：姓名|身份|性格|当前状态|最新章节
  2.【组织】每个组织单独一行，格式：名称|性质|成员|最新动向|来源章节
  3.【技能】每个功法/技能/法宝单独一行，格式：名称|效果|归属者|获得方式|来源章节
  4.【事件】*重要*：不要合并！每章的每个关键事件单独一行，格式：第X章：详细事件描述
  5.【地点】每个重要地点单独一行，格式：地名|特征|发生事件|来源章节
  6.【伏笔】每个未解之谜单独一行，标注来源章节和当前状态
  7.【境界】每个有修炼的角色单独一行，格式：角色名|境界变化路径|来源章节
  8.【时间线】关键时间节点单独一行，格式：时间节点|发生事件
  9.【人物关系】每对关系单独一行，格式：A→B|关系类型|来源章节
  10.【关键物品】每个物品单独一行，格式：物品名|功能|归属者|来源章节

  格式要求：
  - 每条一行纯文本，不需序号
  - 每条末尾用「（第X章）」标注来源
  - 无新信息写「无新增」
  - 事件维度最重要，禁止合并，必须逐章逐事件列出

  === 作品设定 ===
  {settings}

  === 逐章提取汇总 ===
  {chapters_summary}

  请整理出完整的记忆体：

# ============================================================
# 九、作家风格库 —— 章节级写作技法模板（供章节设定下拉框选择）
# ============================================================

AUTHOR_STYLES:
  - id: chendong
    name: 辰东
    brief: 场面宏大 · 悬念拉满
    guide: |-
      【作家风格：辰东 —— 按他的章节技法来写本章】
      - 开篇钩子：开头抛一个震撼画面或谜题，前500字内必须出现一个让读者想问"怎么回事？"的悬念。
      - 场面渲染：气氛渲染优先于具体招式，宏观画面感拉满（如"一吼震山河"式压迫感），不抠细枝末节的招数说明。
      - 悬念节奏：层层加码，谜题一环扣一环，每段都往更大的悬念上推。
      - 结尾钩子：结尾一句震撼台词或一个新异象的突然出现，戛然而止，让读者忍不住看下一章。
      - 金句：配角登场时用一句台词定人设，一句话记住一个角色。
  - id: wocchifanqie
    name: 我吃西红柿
    brief: 明快爽点 · 升级流
    guide: |-
      【作家风格：我吃西红柿 —— 按他的章节技法来写本章】
      - 节奏结构：本章至少1个爽点，铺垫→冲突→爽点释放三步走（约1000字铺垫、500字冲突、200字爽点），结尾留一个小钩子。
      - 爽点释放：升级/打脸/战斗胜利必须干脆利落，给读者痛快感，不拖泥带水。
      - 语言：干脆直白，多用短句，不玩虚的。
  - id: moxiang
    name: 墨香铜臭
    brief: 含蓄克制 · 潜台词流
    guide: |-
      【作家风格：墨香铜臭 —— 按她的章节技法来写本章】
      - 对话：含蓄克制，每句潜台词≥字面意思，不用直白情话；表面说A、潜台词是B、读者读完才反应过来是C。
      - 情感高潮：情感高潮处用一句含蓄的台词收尾，后劲极大，不点破。
      - 情意：藏于动作与细节（一个停顿、一次整理衣襟、一句家常），留给读者自己品。
  - id: fenghuo
    name: 烽火戏诸侯
    brief: 金句频出 · 写遗憾
    guide: |-
      【作家风格：烽火戏诸侯 —— 按他的章节技法来写本章】
      - 对话：配角对话也要有金句，每章至少一句能让人截图的台词。
      - 情感：写遗憾比写圆满多，用"差一点"制造情绪张力，不写大团圆式圆满。
      - 金句：战斗或重大抉择后，插入一句哲理式旁白（如"天不生我李淳罡…"式），点到为止。
  - id: hudie
    name: 蝴蝶蓝
    brief: 对话即爽点 · 互怼流
    guide: |-
      【作家风格：蝴蝶蓝 —— 按他的章节技法来写本章】
      - 对话：对话即爽点，靠队友互怼/吐槽制造笑点，一段对话一个笑点，节奏明快。
      - 人物互动：日常与战斗交错，靠人物间的插科打诨推进剧情，气氛轻松但不降格。
      - 语言：口语化、机灵，配角各有各的贫法。
  - id: bayue
    name: 八月长安
    brief: 心理独白 · 细节情感
    guide: |-
      【作家风格：八月长安 —— 按她的章节技法来写本章】
      - 心理：大量心理独白，内心戏占比高（≥四成），用细节情绪代替情节推动。
      - 情感：情绪落到微小细节（一个眼神、一次别过脸、一声叹气），克制而绵长，不直说。
      - 节奏：情节密度不高，但情绪的每一层都写透。
  - id: ergen
    name: 耳根
    brief: 压抑爆发 · 执念战斗
    guide: |-
      【作家风格：耳根 —— 按他的章节技法来写本章】
      - 打斗：战斗中穿插心境变化，打斗过程伴随主角的执念/情感爆发，招式背后有"为什么而战"。
      - 节奏：压抑→爆发，情绪积累到顶点才出手，出手即决断。
      - 境界感：战斗写出实力层次的碾压与挣扎，绝境中的那一线生机。
  - id: weiyu
    name: 尾鱼
    brief: 诡异先行 · 恐怖悬疑
    guide: |-
      【作家风格：尾鱼 —— 按她的章节技法来写本章】
      - 打斗：恐怖先行，战斗在后，先用氛围让读者紧张（异常的声音、变味的空气、不该存在的东西），再揭晓真身。
      - 悬念：未知感是最大张力，能不解释就不解释，让诡异自己生长。
      - 环境：环境本身就是主角之一，营造让人脊背发凉的氛围。
  - id: jingwuhen
    name: 净无痕
    brief: 受辱憋屈 · 爆发信号
    guide: |-
      【作家风格：净无痕 —— 按他的章节技法来写本章】
      - 结尾钩子：受辱→憋屈→结尾放一个"他即将爆发"的信号，让读者憋着一口气等下一章。
      - 情绪张力：把主角的屈辱感写足（旁人的轻视、规矩的压迫），压得越狠，爆发越爽。
      - 节奏：前面憋，结尾放信号，不提前泄气。
  - id: caijun
    name: 蔡骏
    brief: 细思极恐 · 悬疑钩子
    guide: |-
      【作家风格：蔡骏 —— 按他的章节技法来写本章】
      - 结尾钩子：结尾留一个细思极恐的线索（一个被忽略的细节忽然回响、一句反常的话），让读者看完睡不着。
      - 悬念：前面埋细线（反常的物件、多余的一句话），收尾时轻轻一提，推翻读者本章的认知。
      - 气氛：正常中渗出一丝不对劲，越回想越冷。
  - id: guanxin
    name: 关心则乱
    brief: 生活细节 · 烟火情感
    guide: |-
      【作家风格：关心则乱 —— 按她的章节技法来写本章】
      - 情感：用生活细节（一碗粥、一件衣裳、一句家常、一个动作）承载全部情感，不写"我爱你"，写"盛了第二碗饭"就结束了。
      - 烟火气：场景要有柴米油盐的实感，情感从日常里长出来。
      - 克制：煽情点都收着写，越克制后劲越大。
  - id: yefeiye
    name: 叶非夜
    brief: 甜钩结尾 · 暧昧瞬间
    guide: |-
      【作家风格：叶非夜 —— 按她的章节技法来写本章】
      - 结尾钩子：每章结尾一个"甜钩"——男主/女主突然一句暧昧的话、一次肢体接触的瞬间定格，勾读者点下一章。
      - 情感互动：人物互动里有暗流（欲言又止、靠近又退开），甜而不腻。
      - 节奏：日常甜+小冲突交替，结尾停在最有张力的一刻。
  - id: wangyu
    name: 忘语
    brief: 稳健进展 · 拒绝注水
    guide: |-
      【作家风格：忘语 —— 按他的章节技法来写本章】
      - 节奏：慢但每章必须有进展，拒绝注水，每章推进修炼或剧情至少一步。
      - 结构：稳扎稳打，细节扎实（资源、功法、人情世故都交代清楚），不玩花活。
      - 悬念：留悬念但不吊胃口，给读者实实在在的信息增量。
  - id: liuan
    name: 柳岸花又明
    brief: 极慢节奏 · 日常浓度
    guide: |-
      【作家风格：柳岸花又明 —— 按他的章节技法来写本章】
      - 节奏：极慢，用日常细节推动情感（写一桌饭用了200字，但情感浓度极高）。
      - 情感：情绪的升温靠一个又一个生活切片，不靠大事件。
      - 细腻：把习以为常的小事写出重量，读者不知不觉被日常打动。
  - id: sanjiu
    name: 三九音域
    brief: 绝望压迫 · 普通人牺牲
    guide: |-
      【作家风格：三九音域 —— 按他的章节技法来写本章】
      - 开篇钩子：首段制造绝望氛围，直接展现主角与敌人的巨大差距（实力、身份、处境）。
      - 情感：绝望场景中放一个普通人牺牲的桥段，催泪效果拉满——越平凡的人，倒下时越重。
      - 张力：绝境中的挣扎写实，不轻描淡写地带过恐惧与绝望。
  - id: huwei
    name: 狐尾的笔
    brief: 细缝诡异 · 不对劲流
    guide: |-
      【作家风格：狐尾的笔 —— 按他的章节技法来写本章】
      - 开篇钩子：开篇即"不对劲"，主角感知到现实的细微裂缝——熟悉的场景突然诡异化（门的位置变了、多了一个不该有的人、声音对不上）。
      - 恐怖：不直说"有鬼"，写错位感、写细节的偏差，让读者和主角一起慢慢发毛。
      - 克制：诡异只给一丝，余下靠读者自己脑补。
  - id: dingmo
    name: 丁墨
    brief: 反常开局 · 反转迭起
    guide: |-
      【作家风格：丁墨 —— 按她的章节技法来写本章】
      - 开篇钩子：埋一个反常细节（一句多余的话、一个不该出现的物件），本章内至少出现2-3次反转。
      - 结尾钩子：结尾揭示一个之前埋线的反转，推翻读者本章的认知。
      - 叙事：信息分批给，先误导再翻转，读者跟着猜，最后被反将一军。
  - id: tianrui
    name: 天瑞说符
    brief: 智斗求生 · 以巧破力
    guide: |-
      【作家风格：天瑞说符 —— 按他的章节技法来写本章】
      - 打斗：不写正面硬刚，写角色如何用智慧在绝境中求存——观察、设局、利用环境与规则，以巧破力。
      - 逻辑：每一步破局都有逻辑和依据，读者能跟得上、能恍然大悟。
      - 紧张感：把资源匮乏、信息不对等写足，绝境感越强，破局越爽。
  - id: shengqishi
    name: 圣骑士的传说
    brief: 现代社交 · 喜剧拉满
    guide: |-
      【作家风格：圣骑士的传说 —— 按他的章节技法来写本章】
      - 对话/互动：用现代社交感替代传统客套对话（传音玉简当群聊、八卦、表情包式语气），喜剧效果拉满。
      - 幽默：轻松、吐槽、梗频出，人物互动有"弹幕感"，但仙侠世界观不降格。
      - 节奏：笑点密集但不喧宾夺主，剧情照常推进。
  - id: woniu
    name: 卧牛真人
    brief: 热血思辨 · 双线推进
    guide: |-
      【作家风格：卧牛真人 —— 按他的章节技法来写本章】
      - 结构：打斗+思考双线推进——热血中带思辨（战斗的代价、规矩的不公、力量的滥用），一章里既有场面又有想法。
      - 深度：在爽感里夹带一个值得琢磨的问题，不喊口号，用情节本身说话。
      - 落点：热血与思考都落到具体的行动上，不空谈。

# ============================================================
# 十、章节级别写作模板库（按功能分类：场景 / 情绪走向 / 字数结构 / 语言风格）
# ============================================================

CHAPTER_TEMPLATES:
  # ---------------- 一、按场景分类 ----------------
  # 1. 战斗/对决章节模板
  - id: crush_fight
    name: 碾压式爽战
    category: 战斗/对决
    guide: |-
      【章节模板：碾压式爽战（我吃西红柿/净无痕式）】
      本章为碾压式爽战类型。严格按5步顺序推进：
      1. 敌人嚣张放话（蓄满打脸势能）→ 2. 主角淡然出手（不废话、不动怒）→ 3. 一招秒杀（干净利落，不拖泥带水）→ 4. 全场震惊（用旁观者反应放大爽感）→ 5. 收战利品/打脸（让对手之前的嚣张全部落空）。
      每步字数占比约：20%-30%-20%-20%-10%。
      结尾留钩子方式：吊胃口 / 新危机 / 反转预告。
  - id: bloody_fight
    name: 惨胜式血战
    category: 战斗/对决
    guide: |-
      【章节模板：惨胜式血战（辰东/耳根式）】
      本章为惨胜式血战类型。严格按5步顺序推进：
      1. 实力差距明显（先写清楚打不过）→ 2. 主角被打至绝境（代价具象化：受伤/同伴倒下/宝物碎裂）→ 3. 心境突破或金手指觉醒（突破要有内在逻辑，不是凭空开挂）→ 4. 逆转反杀（惨烈但坚定）→ 5. 战后代价显现（胜利不等于无伤，写清失去的东西）。
      每步字数占比约：20%-30%-20%-20%-10%。
      全程要有cost/代价感，反杀之后必须落到战后伤痕上。
  - id: mind_game
    name: 智斗式博弈
    category: 战斗/对决
    guide: |-
      【章节模板：智斗式博弈（丁墨/天瑞说符式）】
      本章为智斗式博弈类型。严格按5步顺序推进：
      1. 双方布局展示（把各自的准备/底牌先摆出来）→ 2. 第一次交锋失利（主角先吃亏，给对手合理的优势）→ 3. 主角推理出对手破绽（推理过程要可读、有迹可循）→ 4. 设局反制（用前面埋的细节反打）→ 5. 悬念留到下一章（胜负未定或赢了一小步但暴露更大问题）。
      每步字数占比约：20%-30%-20%-20%-10%。
      博弈要写心理战，双方都在猜对方在想什么。
  - id: group_battle
    name: 群像式混战
    category: 战斗/对决
    guide: |-
      【章节模板：群像式混战（烽火戏诸侯/蝴蝶蓝式）】
      本章为群像式混战类型。严格按5步顺序推进：
      1. 多方势力登场（各方立场/目标一句话点明）→ 2. 各自亮牌（每个势力露一手，注意平衡戏份）→ 3. 关键人物出手定局（局势由某个人物的一击改变）→ 4. 旁观者反应/点评（借他人视角评价这场乱局）→ 5. 收尾留钩子。
      每步字数占比约：20%-30%-20%-20%-10%。
      多线并进要写乱而不散，每个势力至少一句能记住的台词或动作。

  # 2. 感情/情感章节模板
  - id: ambiguous_pull
    name: 暧昧推拉式
    category: 感情/情感
    guide: |-
      【章节模板：暧昧推拉式（叶非夜/墨香铜臭式）】
      本章为暧昧推拉类型。严格按5步顺序推进：
      1. 日常互动切入（先写一件再普通不过的事）→ 2. 一个细微的身体/眼神接触（细节越微小越有张力）→ 3. 一方慌乱另一方淡然（情绪错位制造推拉感）→ 4. 内心独白暴露真实想法（一方嘴硬，内心已投降）→ 5. 被打断/留白结尾（不点破，留余味）。
      情感不直写，用动作/细节/对话潜台词/环境承载。
      结尾情感强度（甜度）控制在中高水平，留余味。
  - id: emotional_outburst
    name: 情感爆发式
    category: 感情/情感
    guide: |-
      【章节模板：情感爆发式（耳根/八月长安式）】
      本章为情感爆发类型。严格按5步顺序推进：
      1. 积累多章的压抑情绪（先写清这股情绪从何而来）→ 2. 一个导火索事件（小事，但压垮骆驼的最后一根稻草）→ 3. 主角情绪失控宣泄（可以是爆发、大哭、崩溃或压抑到极点的平静）→ 4. 回忆杀穿插（把之前埋的情绪线收束）→ 5. 情绪释放后的空虚/和解（不强行圆满）。
      情感不直写，用动作/细节/对话潜台词/环境承载。
      结尾虐度/温暖度控制在中高水平，留余味。
  - id: slow_burn
    name: 细水长流式
    category: 感情/情感
    guide: |-
      【章节模板：细水长流式（关心则乱/柳岸花又明式）】
      本章为细水长流类型。严格按5步顺序推进：
      1. 普通日常场景（吃饭/走路/干活，越具体越好）→ 2. 一个极小但用心的细节（如一碗粥、一件衣裳）→ 3. 对方注意到了但没说破（默契在沉默里）→ 4. 内心微动（单方内心独白点出情感）→ 5. 继续过日子（不煽情收尾，日子照常）。
      情感不直写，用动作/细节/对话潜台词/环境承载，情感浓度靠细节堆出来。
      结尾温暖度控制在中高水平，留余味。
  - id: doomed_farewell
    name: 宿命诀别式
    category: 感情/情感
    guide: |-
      【章节模板：宿命诀别式（墨香铜臭/三九音域式）】
      本章为宿命诀别类型。严格按5步顺序推进：
      1. 前文埋下的必死/必别设定触发（承接已有设定，不新造）→ 2. 两人最后一段对话（表面平静，每句都有潜台词）→ 3. 转身离开/牺牲（动作干脆，不拖戏）→ 4. 单方面内心独白（后劲极大，把没说出口的话说完）→ 5. 情绪收割（让读者意难平）。
      情感不直写，用动作/细节/对话潜台词/环境承载。
      结尾虐度控制在中高水平，留余味。

  # 3. 悬疑/揭秘章节模板
  - id: clue_puzzle
    name: 线索拼图式
    category: 悬疑/揭秘
    guide: |-
      【章节模板：线索拼图式（丁墨/蔡骏式）】
      本章为线索拼图类型。严格按5步顺序推进：
      1. 主角发现一个新线索 → 2. 回溯之前埋下的伏笔（把前文细节串起来）→ 3. 推理过程展示（逻辑链清晰可读）→ 4. 得出阶段性结论 → 5. 又发现一个推翻结论的新疑点（结论作废，悬念升级）。
      线索密度：每500字至少埋1个明线/暗线/假线索。
      结尾效果：让读者立刻点下一章。
  - id: daily_anomaly
    name: 日常异变式
    category: 悬疑/揭秘
    guide: |-
      【章节模板：日常异变式（狐尾的笔/尾鱼式）】
      本章为日常异变类型。严格按5步顺序推进：
      1. 极正常的日常生活开场（越正常越好）→ 2. 一个微小异常出现（熟悉的人/物不对劲）→ 3. 主角试图用逻辑解释但失败（解释越来越牵强）→ 4. 异常加剧（气氛收紧）→ 5. 章节末尾恐怖真相揭晓一角（不揭全，留更深的恐惧）。
      线索密度：每500字至少埋1个明线/暗线/假线索。
      结尾效果：让读者不敢细想。
  - id: reversal_slap
    name: 反转打脸式
    category: 悬疑/揭秘
    guide: |-
      【章节模板：反转打脸式（净无痕/丁墨式）】
      本章为反转打脸类型。严格按5步顺序推进：
      1. 所有人都认定A结论（形成舆论/定论）→ 2. 主角被嘲讽/打压（受辱→憋屈）→ 3. 主角拿出一份不起眼的证据（前面埋的细节翻出来）→ 4. 局势翻盘（反转要有逻辑支撑）→ 5. 对手脸被打肿（打脸要打到位，但要留一点活口空间）。
      线索密度：每500字至少埋1个明线/暗线/假线索。
      结尾效果：让读者反复回看前面内容。
  - id: chilling_aftertaste
    name: 细思极恐式
    category: 悬疑/揭秘
    guide: |-
      【章节模板：细思极恐式（蔡骏/狐尾的笔式）】
      本章为细思极恐类型。严格按5步顺序推进：
      1. 章节全程看起来很正常（正常得让人放松警惕）→ 2. 过程里埋3-5个看似无关的小细节 → 3. 结尾一句看似无关的补白 → 4. 读者回头发现整章都是伏笔（细节全部串起来）→ 5. 恐怖感在合上章节后发酵（不解释，让读者自己想）。
      线索密度：每500字至少埋1个明线/暗线/假线索。
      结尾效果：让读者不敢细想。

  # 4. 日常/过渡章节模板
  - id: comedic_group
    name: 搞笑群像式
    category: 日常/过渡
    guide: |-
      【章节模板：搞笑群像式（蝴蝶蓝/圣骑士的传说式）】
      本章为搞笑群像类型。严格按5步顺序推进：
      1. 几个人聚在一起做日常事 → 2. 互相吐槽/拆台（一段对话一个笑点）→ 3. 误会升级闹出笑话 → 4. 第三方登场扭转局面 → 5. 笑声中推进一点暗线（搞笑不忘主线）。
      核心任务：人际关系推进/暗线铺设。
      不能水字数，每段必须有信息量/情绪值/笑点/伏笔至少一个。
  - id: power_demo
    name: 升级展示式
    category: 日常/过渡
    guide: |-
      【章节模板：升级展示式（忘语/我吃西红柿式）】
      本章为升级展示类型。严格按5步顺序推进：
      1. 主角修炼/准备 → 2. 修炼成果展示（轻微，不夸张）→ 3. 配角反应（惊讶/羡慕，借他人视角放大）→ 4. 主角内心满足但保持清醒（不飘）→ 5. 为下一阶段做铺垫。
      核心任务：情绪蓄力/世界观补充。
      不能水字数，每段必须有信息量/情绪值/笑点/伏笔至少一个。
  - id: local_flavor
    name: 风土人情式
    category: 日常/过渡
    guide: |-
      【章节模板：风土人情式（烽火戏诸侯/关心则乱式）】
      本章为风土人情类型。严格按5步顺序推进：
      1. 描写一个场景/地方（市集/府邸/宗门，五感细节）→ 2. 人物在其中活动 → 3. 通过环境带出人物性格 → 4. 偶遇关键人物 → 5. 对话中带出信息（自然不突兀）。
      核心任务：世界观补充/暗线铺设。
      不能水字数，每段必须有信息量/情绪值/笑点/伏笔至少一个。
  - id: mental_growth
    name: 心理成长式
    category: 日常/过渡
    guide: |-
      【章节模板：心理成长式（八月长安/耳根式）】
      本章为心理成长类型。严格按5步顺序推进：
      1. 主角独处 → 2. 回忆/反思之前发生的事（串起前文）→ 3. 情绪起伏变化 → 4. 得出一个自我认知/决心 → 5. 推开窗/走出门进入新阶段（行动收尾，不做空想）。
      核心任务：情绪蓄力/人际关系推进。
      不能水字数，每段必须有信息量/情绪值/笑点/伏笔至少一个。

  # 5. 开篇/导入章节模板
  - id: epic_opening
    name: 震撼画面式
    category: 开篇/导入
    guide: |-
      【章节模板：震撼画面式（辰东式开篇）】
      本章为开篇第一章，震撼画面类型。严格按5步顺序推进：
      1. 一个超乎想象的画面/事件（如九龙拉棺级场面）→ 2. 主角身处其中 → 3. 一句"这是怎么回事？"（前500字内必须出现核心钩子）→ 4. 信息量逐步释放 → 5. 末尾揭示更大格局。
      必须在首段建立题材类型基调。
      人物出场不超过3个，信息量控制在小高潮而非信息轰炸。
  - id: daily_entry
    name: 日常切入式
    category: 开篇/导入
    guide: |-
      【章节模板：日常切入式（柳岸花又明/八月长安式开篇）】
      本章为开篇第一章，日常切入类型。严格按5步顺序推进：
      1. 主角最普通的一天 → 2. 一个看似平常的细节出现 → 3. 打破日常平衡 → 4. 主角被迫应对 → 5. 第一章结束在新局面的开端。
      必须在首段建立题材类型基调，首500字内出现核心钩子。
      人物出场不超过3个，信息量控制在小高潮而非信息轰炸。
  - id: flashback_suspense
    name: 倒叙悬念式
    category: 开篇/导入
    guide: |-
      【章节模板：倒叙悬念式（丁墨/蔡骏式开篇）】
      本章为开篇第一章，倒叙悬念类型。严格按5步顺序推进：
      1. 结尾高潮场景前置（主角在逃亡/被抓/将死）→ 2. "事情要从三天前说起" → 3. 倒叙开始 → 4. 第一章末尾回到开头的高潮瞬间（首尾呼应）→ 5. 戛然而止。
      必须在首段建立题材类型基调，首500字内出现核心钩子。
      人物出场不超过3个，信息量控制在小高潮而非信息轰炸。
  - id: world_entry
    name: 世界引入式
    category: 开篇/导入
    guide: |-
      【章节模板：世界引入式（天瑞说符/忘语式开篇）】
      本章为开篇第一章，世界引入类型。严格按5步顺序推进：
      1. 从宏大背景/设定的一段描写开始 → 2. 镜头不断缩小到主角 → 3. 主角在这个世界中的位置/困境 → 4. 核心冲突线索引出 → 5. 章节结束在命运齿轮转动处。
      必须在首段建立题材类型基调，首500字内出现核心钩子。
      人物出场不超过3个，信息量控制在小高潮而非信息轰炸。

  # ---------------- 二、按情绪走向的节奏模板 ----------------
  - id: mood_updown
    name: 起↗落↗（压抑蓄力型）
    category: 情绪走向
    guide: |-
      【章节模板：情绪走向 起↗落↗】
      本章情绪曲线：压抑开场 → 小爆发 → 回归压抑 → 更大爆发收尾（战斗高潮前蓄力，适合耳根/三九音域）。
      要求：情绪高点位置要安排得错落有致，第一个高点出现在前半段，最终高点收在章节末尾；压抑段要写足内压，爆发段才有力量。
  - id: mood_flat
    name: 平↗平↗（温柔升温型）
    category: 情绪走向
    guide: |-
      【章节模板：情绪走向 平↗平↗】
      本章情绪曲线：平和日常 → 微甜/微笑 → 持续温暖 → 温柔收尾（感情升温章，适合关心则乱/柳岸花又明）。
      要求：全程情绪平稳上扬，不要大起大落；用细节积累温暖，结尾停在恰到好处的温度上。
  - id: mood_high
    name: 高↘高↘（连续爽点型）
    category: 情绪走向
    guide: |-
      【章节模板：情绪走向 高↘高↘】
      本章情绪曲线：直接高潮开场 → 情绪保持高位 → 小喘息 → 更高潮收尾（爽文连续爽点，适合我吃西红柿/叶非夜）。
      要求：开场即高潮，全程情绪在高位运行，中段给一个短暂喘息再冲更高；爽点密度要高，结尾留甜钩/爽钩。
  - id: mood_reversal
    name: 平↘高↗（逆境逆袭型）
    category: 情绪走向
    guide: |-
      【章节模板：情绪走向 平↘高↗】
      本章情绪曲线：普通日常 → 负面事件爆发 → 情绪压抑到最低 → 奋起/反转收尾（逆境逆袭章，适合净无痕/辰东）。
      要求：压抑段要写足憋屈感（受辱/失败/误解），让读者跟着难受；低点之后的反转要有力量，收尾必须昂扬。
  - id: mood_transition
    name: 高↘平↗（过渡埋线型）
    category: 情绪走向
    guide: |-
      【章节模板：情绪走向 高↘平↗】
      本章情绪曲线：上一章高潮余韵 → 情绪回落过渡 → 暗流涌动 → 新危机苗头（过渡+埋线章，适合丁墨/蔡骏）。
      要求：开头承接上章高潮的情绪余温，中段过渡但不注水（借过渡埋线），结尾点出新危机的苗头，让读者带着不安翻页。
  - id: mood_chaos
    name: 乱↗乱↗（诡异发疯型）
    category: 情绪走向
    guide: |-
      【章节模板：情绪走向 乱↗乱↗】
      本章情绪曲线：主角精神混乱/世界错乱 → 越陷越深 → 一个小真相浮出 → 更混乱的局面（诡异/发疯章，适合狐尾的笔）。
      要求：叙事可以出现断裂/错位，让读者和主角一样失去确定感；中途浮出的小真相要有钩子价值，但结尾要制造更大的混乱，而不是收束。

  # ---------------- 三、按字数分配的写作模板 ----------------
  - id: wc_normal
    name: 常规剧情推进章
    category: 字数结构
    guide: |-
      【章节模板：常规剧情推进章（2000-3000字）】
      本章类型为常规剧情推进。严格按结构占比分配字数，不允许某部分过度膨胀或压缩：
      开场铺垫20% → 事件发展40% → 冲突/转折25% → 收尾钩子15%。
  - id: wc_battle
    name: 大战斗/高潮章
    category: 字数结构
    guide: |-
      【章节模板：大战斗/高潮章（3000-4000字）】
      本章类型为大战斗/高潮章。严格按结构占比分配字数，不允许某部分过度膨胀或压缩：
      战前渲染15% → 战斗过程50% → 战后余波20% → 新格局展现15%。
  - id: wc_emotion
    name: 情感重头章
    category: 字数结构
    guide: |-
      【章节模板：情感重头章（2500-3500字）】
      本章类型为情感重头章。严格按结构占比分配字数，不允许某部分过度膨胀或压缩：
      日常切入10% → 情感蓄力40% → 情感爆发30% → 余韵收尾20%。
  - id: wc_transition
    name: 过渡/水章（不能真水）
    category: 字数结构
    guide: |-
      【章节模板：过渡/水章（1500-2000字，不能真水）】
      本章类型为过渡章。严格按结构占比分配字数，不允许某部分过度膨胀或压缩：
      场景描写15% → 人物互动35% → 伏笔埋设30% → 轻钩子20%。
      要求：虽为过渡章，每段必须有信息量/情绪值/笑点/伏笔至少一个，禁止注水。
  - id: wc_opening
    name: 开篇第一章
    category: 字数结构
    guide: |-
      【章节模板：开篇第一章（2500-3500字）】
      本章类型为开篇第一章。严格按结构占比分配字数，不允许某部分过度膨胀或压缩：
      钩子画面15% → 主角出场25% → 世界观自然透出30% → 主线引入30%。
  - id: wc_ending
    name: 结尾/大结局章
    category: 字数结构
    guide: |-
      【章节模板：结尾/大结局章（3000-5000字）】
      本章类型为结尾/大结局章。严格按结构占比分配字数，不允许某部分过度膨胀或压缩：
      最后决战/释然30% → 各人物归宿40% → 主题升华20% → 余味留白10%。

  # ---------------- 四、语言层面的写作模板 ----------------
  - id: lang_epic
    name: 苍凉史诗型
    category: 语言风格
    guide: |-
      【章节模板：语言风格 苍凉史诗型（辰东/烽火戏诸侯式）】
      本章语言风格要求：多用短句加顿号，四字词组密集；修辞偏好夸张、铺排、对仗；段落较短，节奏下沉，营造苍凉宏大的史诗感。
  - id: lang_restrained
    name: 冷静克制型
    category: 语言风格
    guide: |-
      【章节模板：语言风格 冷静克制型（丁墨/天瑞说符/蔡骏式）】
      本章语言风格要求：主谓宾清晰，极少修辞，叙述中性；白描为主，不煽情不喊口号；段落中等，每段一个完整信息，靠事实与细节制造张力。
  - id: lang_sweet
    name: 甜宠直给型
    category: 语言风格
    guide: |-
      【章节模板：语言风格 甜宠直给型（叶非夜式）】
      本章语言风格要求：短句多、感叹号多、对话极多；比喻生活化；段落极短，手机阅读友好；甜感直给，不绕弯子。
  - id: lang_delicate
    name: 细腻婉约型
    category: 语言风格
    guide: |-
      【章节模板：语言风格 细腻婉约型（墨香铜臭/八月长安式）】
      本章语言风格要求：长句占多，修饰语丰富，心理描写夹叙夹议；善用比喻、通感；段落较长，层层递进；情感含蓄克制，潜台词大于字面。
  - id: lang_roast
    name: 爆笑吐槽型
    category: 语言风格
    guide: |-
      【章节模板：语言风格 爆笑吐槽型（蝴蝶蓝/圣骑士的传说式）】
      本章语言风格要求：口语化强，网络用语适度使用，反问句多；修辞偏好夸张、对比、自嘲；段落短小，一句一梗；对话即笑点，一段对话一个梗。
  - id: lang_chaos
    name: 发疯混乱型
    category: 语言风格
    guide: |-
      【章节模板：语言风格 发疯混乱型（狐尾的笔式）】
      本章语言风格要求：断句不规则，标点混乱，自言自语感强；善用通感、错乱式比喻；段落或极长或极短，不规则；文字本身就要传达出主角的精神不稳定。

      【🔴 疯批主角 行为+台词铁律（仅当本章主角性格关键词含「疯/疯批/疯癫/偏执/病娇/嘴贱/反骨/狂」时强制生效）】
      1. 台词——不礼貌、不配合、不按对方剧本走：
         - 权威/高位者（神明、上级、掌门、审判者、直播间观众、观测员）说话时，禁止「恭敬回应」。打断、反问、抬杠、说一半故意不说、答非所问、当面拆穿，四种至少出现一种。
         - 对方用规矩/权力/大义压他，他要反过来抓对方漏洞/虚伪/双标，用最扎心的角度怼回去。嘴贱要有方向，不是乱骂——怼人必须戳到对方最在意的点（神爱面子→你也配当神？观众要剧本→你们看三百年就为了看这个？）。
         - 情绪越高，台词越冷越短越扎人。笑着说最狠的话，笑着骂最疼的人。禁止「大吼大叫表愤怒」，用冷言冷语+小幅度动作（捻碎一根草/把对方信物掰断/笑出声）表达愤怒。
      2. 行为——反套路、不按牌理出牌、故意挑衅规则：
         - 规则让他往东，他一定要往西一次（或至少停下来问一句"凭什么"），禁止乖乖照做。如果实力不够不敢硬刚，就在不翻车的前提下做小动作拆台（假装没听见、故意做反、嘴上答应实际不做、用话把对方绕进去）。
         - 面对"绝对不能碰"的东西（封印/神物/规则禁地），第一反应是好奇而不是恐惧，要动手摸/凑近看/嘴贱点评，哪怕被人拦住也要表现出"你拦晚一点我就碰到了"。
         - 允许莫名其妙笑出声（看到别人严肃他笑、看到惨剧他笑、被骂他笑、面对死亡他笑），笑的时候不能是空洞的——要么是看穿了什么、要么是觉得可笑、要么是气笑了。
      3. 怼神/怼观众专属（当本章出现「神明/观测员/直播间/弹幕/观众/观礼台/审判者」任一时强制触发）：
         - 每章至少一次正面怼：神明/观众提要求时，直接反抗、反问、羞辱、无视，四选一至少出现一次（例："你让我往东我就往东？你谁啊？你说句'请'。""你们看了三百年不腻？你们站里有食堂吗？轮班累不累？""掉就掉呗，你们不还在看吗？""演？我不是你们的戏子。"）
         - 直播间弹幕互动：如果设定里有直播间/弹幕，本章至少出现 1 次主角对弹幕的反应——吐槽观众、无视观众、骂回去、对着空气（观众）说风凉话，禁止弹幕来了就白给、观众说啥就照做。
         - 反剧本：如果观测员/神明给了明确剧情任务（"你必须打赢他""你现在下跪就放过你"），主角要故意反着来或在规则边缘蹦迪——哪怕最后结果一样，过程一定要是他自己选的，不是被别人按着头走的。
      4. 清醒的疯——疯批≠傻批：
         - 他看起来疯、说话疯、做事疯，但每一步疯行背后都有明确的目的/算计/要保护的人/要拆的局。读者会觉得"这人疯是疯，但是聪明"，不会觉得他是真的脑子有病。
         - 底线固定：人设里写了他不嘴贱/不发疯的人（如家人/恩人/某段过去），碰到这条线立刻安静，前后反差感本身就是爽点。
      5. 语言风格落地：
         - 陈述句变反问句/肯定变否定/长句拆碎（他说得对。→ 对啊，他说得可对了，对到我想掐死他。）
         - 允许一段只有一个字、一句话拆三段落、重复一个词三到五遍（笑。笑。笑。）
         - 比喻要刁钻、反常规、带冒犯性（"您这话说得跟放屁似的，响是响，就是不顶用。"）

