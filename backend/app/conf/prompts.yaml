  □ 过AI检测：无三连排比/无金句开篇/无"不是X是Y"解释句/无破折号"——"/无重复点题/修饰未堆叠/无五感全覆盖/明喻≤3次（每1000字≤1、单段≤2）/四字格每段≤1个/冒号≤3次/有口语毛边与长短句突变？短句独立段（≤12字）占比在15%~35%之间（低于15%=说明书、高于35%=碎片化，都判AI）？无相邻/跨段连续≥16字雷同（换词重写也算）？无"是X。"判断句独立成段扎堆（全章≤1处）？无"不知道。不知道。"否定排队？无等长台词对仗（"比我的大。""也比我的旧。"成对）？
  □ 破行为模式：无"沉默""空气安静""停了半拍"缓冲独立段（"顿了顿。"也算）、无"他停了一下""片刻后"状态补丁？对话非"一句台词配一个等长动作"均匀交替（允许三句台词零动作、台词混入叙述段）？未贴情绪词、未自问自答摆情绪（"怕吗？怕。"）？无扫描式完整描写、无递进骨架（追问层层加深/动作三连/心理 A→B→C/"先是…然后…然后…"连接词骨架，碎片句但骨架整齐也算）？段落结尾未总结陈词/工整收尾/悬念定格？叙述无"笑了。""很淡。"式≤4字极短独立段（台词单独成段除外）？
  □ 破节奏模式：无连续3段"人物+动作"句式铺排（中间插了环境/生理/心理细节）？对话非连续2轮"问？答。问？"剧本式（问答间有动作/反应打断）？无"光——渗进——画出"式模板描写链？无"动作→环境→动作→环境"节拍循环？无"因为A所以B因此C"设定解释（改用感受让读者推）？句子长短交错（有极短句也有长句）？
  □ 破内容模式：无连续三轮"不知道/是/否"单句对答？台词未等长对仗工整收尾？"比"字比较句≤2处？无"被……了"成串？同一命名词（烛火/灾厄）≤3次已换变体？数字只给模糊状态未逐级报数？固定搭配已拆开写？动词不标准（用拽/抽/扎，不用挪/硌）？弹幕掺了废话未层层递进？
  □ 字数达标：达到文末字数要求？最后一个事件写完且达标后才停笔，无画蛇添足？
  □ 输出格式：第一句就是正文，无标题/开场白/说明文字？

  【🔴🔴🔴 AI检测硬性执行令 —— 只准按下列正例写法输出，违反任一条=废稿。这些句式是AI味标记：与其字面相似的任何变体（换词、换标点、拆散重组）一律禁止出现，一个都不许有！】

  1. 系统播报：引导句（"光屏中央烫出一行金字：「可以。」"）全章只准用一次，之后每次直接给内容（"「确认。」"）；"金字/文字/光屏+浮现/回复/弹出/亮起/继续"组合不得再出现。
  2. 弹幕：直接上弹幕原文（"光屏刷出一排问号""几条弹幕滚过，全是骂声"）。禁止"弹幕"后接状态词（停/炸/沉默/安静/活过来/又动起来/不知道该骂什么/重新刷起等）再拖出内容的句式；"一条弹幕飘出来"引子全章只用1次。
  3. 判断句：禁止段落以"是+形容词/名词+。"独立起头；句号后的"是X。"补注并入前句改写（"弹幕突然安静了"）；禁止"不是X，不是Y"排比。
  4. 说明书：禁止"简介/修炼条件/功法属性/上限标注"标签罗列设定；设定由角色视角或动作带出（"练气期就能修。灵力压在指尖，点中目标就炸"）。
  5. 动词：同一动词跨句连排≥2次改顿号合并（"流过锁骨、左肋断骨、指尖"）或换具体动词。
  6. 残缺句：禁止"形容词+得+逗号/句号"收尾，必须补全（"声音冷得发寒"）。
  7. 高频短语：禁止"被推到X角落""X说不清地""说不清是什么""X，不是Y"补语断句、"是某种更X的东西"——一律直写状态。
  8. 冒号：禁止"《书名》+冒号/逗号+规格""修炼条件+冒号/逗号+规格"标签直插；条件直接写进叙述（"骨骼需反复断裂再愈合，断一次强一分"）。
  9. 教科书对仗：禁止"远程输出寿元长但肉身脆/近战坦克肉身成圣但前期挨打多"式利弊对仗总结；设定靠角色抉择和动作漏出来，不许成句铺排。

  停笔前最后一步：数一遍"弹幕+状态词"几次、"是X。"判断句几次、标签直插（简介/修炼条件/书名冒号）几次、教科书对仗几处、"被推到X/说不清/是某种更"几次、"得+逗号句号"残缺几次、≤4字极短独立段几次。超标的当场改，改完再输出。

  【🔴🔴🔴 绝对禁止令 —— 违反任何一条=废稿重写，不可商量】
  1. 全章"——"破折号出现次数=0。不是"尽量少用"，是"一个都不许有"。需要转折用逗号或另起一句。弹幕/对话引出禁止用"——"开头，一律用「」包裹弹幕内容。
  2. 全章"不是X，是Y"或"不是X——是Y"句式最多1次。第2次开始换直述。
  3. 全章"跟X似的/像X一样/如同X"明喻最多2次。
  4. 全章任何场景的物品罗列不超过3样，第4样必须模糊处理（"还有别的，看不清"）。
  以上4条在你输出前必须逐条数过次数，超标的改掉再输出。

