#  修改提示词只需编辑本文件，保存后下一次调用自动生效（热加载，无需重启后端）。
#
#  语法约定：
#  - 多行文本用块标量：`|` 保留末尾换行，`|-` 去掉末尾换行。
#  - 内部引用：文本中出现 `__键名__` 时，加载后自动替换为同文件该键的值
