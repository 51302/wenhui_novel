# ========================================================================
#  支付宝电脑网站支付配置
#  对接支付宝真实验签时，填好 app_id / app_private_key / alipay_public_key 即可
#  未配置时自动运行在 Demo 模式（本地模拟支付，用于开发调试）
# ========================================================================
alipay:
  sandbox: true                          # true=沙箱环境 false=正式环境
  # -- 核心密钥（填入后自动切换为真实验签模式） --
  # 应用ID，沙箱环境 → 开放平台研发服务中获取
  
  # 正式环境
  # app_id: "2021006169682344"   #正式上线的app_id
  # 应用私钥：去掉PEM头尾、去掉换行，拼接成一行
  # app_private_key: ""
  # 应用公钥： 该公钥只是记录一下
  # app_public_key: ""
  # 支付宝公钥：上传你的公钥后支付宝返回的密钥（填空则模拟验签）
  # alipay_public_key: ""
  # seller_id: "2088422450482191"

  # 砂箱环境
  app_id: "9021000165634936"
  app_private_key: ""
  app_public_key: ""
  alipay_public_key: ""
  
  # -- 收款校验 --
  # 收款商户PID，支付后校验seller_id是否为你的账户，防止打到别人那
  seller_id: "2088721102987571"

  # -- 回调地址 --
  # 异步通知地址：支付宝POST通知你支付结果，后端 API 端口
  notify_url: "http://127.0.0.1:8000/api/vip/notify"

  # 支付完成后浏览器跳转到前端 VIP 页面（前端端口 3000）
  return_url: "http://127.0.0.1:3000/vip"


  # -- 行为参数 --
  order_timeout: "15m"               # 订单超时时间（m=分钟 h=小时 d=天）
  order_prefix: "VIP"                # 订单号前缀
  default_plan: "vip_monthly"        # 默认套餐

  # -- VIP/SVIP 套餐配置 --
  # vip_level: 1=VIP(10章/天), 2=SVIP(50章/天)
  plans:
    # VIP 套餐（10章/天）
    vip_monthly:
      name: "VIP月度会员"
      price: "29.00"
      days: 30
      desc: "1个月VIP · 10章/天"
      vip_level: 1
    vip_quarterly:
      name: "VIP季度会员"
      price: "79.00"
      days: 90
      desc: "3个月VIP · 10章/天"
      vip_level: 1
    vip_yearly:
      name: "VIP年度会员"
      price: "259.00"
      days: 365
      desc: "12个月VIP · 10章/天"
      vip_level: 1
    # SVIP 套餐（50章/天）
    svip_monthly:
      name: "SVIP月度会员"
      price: "59.00"
      days: 30
      desc: "1个月SVIP · 50章/天"
      vip_level: 2
    svip_quarterly:
      name: "SVIP季度会员"
      price: "149.00"
      days: 90
      desc: "3个月SVIP · 50章/天"
      vip_level: 2
    svip_yearly:
      name: "SVIP年度会员"
      price: "499.00"
      days: 365
      desc: "12个月SVIP · 50章/天"
      vip_level: 2
