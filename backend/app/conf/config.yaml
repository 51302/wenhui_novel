# ============================================================
#  文辉小说 - 后端配置文件
#  修改后需重启容器生效
# ============================================================

app:
  name: "文辉小说"              # 应用名称（显示在 API 文档标题等位置）
  version: "1.0.0"             # 应用版本号
  debug: true                  # 调试模式：true=详细日志/错误堆栈，false=生产环境精简日志
  show_all_works: true         # 首页展示范围：true=所有人可见所有作品，false=用户只能看到自己的作品
  website_url: "https://wenhui.nat100.top"  # 网站域名（用于邮件链接、支付宝回调等外部访问）

mysql:
  host: wenhui-mysql           # MySQL 主机名（Docker 内部服务名或 IP）
  port: 3306                   # MySQL 端口
  user: wenhui                 # 数据库用户名
  password: wenhui123          # 数据库密码
  database: easy-novel         # 数据库名称
  charset: utf8mb4             # 字符集（utf8mb4 支持 emoji）
  pool_size: 50                # 连接池大小（支撑3000 VIP用户建议50-100）
  max_overflow: 100            # 连接池溢出上限（峰值并发时临时创建的连接数）
  pool_recycle: 3600           # 连接回收周期（秒），建议设为 MySQL wait_timeout 的一半

redis:
  host: wenhui-redis           # Redis 主机名（Docker 内部服务名或 IP）
  port: 6379                   # Redis 端口
  password: ""                 # Redis 密码（无密码留空）
  db: 0                        # Redis 数据库编号（0-15）
  cache_ttl: 3600              # 默认缓存过期时间（秒），1小时
  memory_extract_threads: 1   # 记忆体提取并发线程数（串行执行，避免多章同时提取导致API超时）

task_queue:
  max_concurrency: 10          # 全局 AI 并发上限，所有队列共享此限制（避免触发 DeepSeek 限流）
  workers:
    ai:extract: 3              # 提取信息队列 Worker 数（从章节中提取人物/组织/地点等）
    ai:generate: 4             # 生成章节队列 Worker 数（最核心队列，分配最多线程）
    ai:regenerate: 2           # 重新生成队列 Worker 数（用户对章节不满意时重新生成）
    ai:continue: 4             # 续写章节队列 Worker 数（基于已有内容继续写作）

memory:
  max_inject_chars: 0          # 不限制记忆体注入，检索出多少就注入多少
  skip_repair_on_generate: true  # 生成时跳过三源修复（直接用Redis缓存，不触发额外AI调用）

elasticsearch:
  host: http://localhost:9200  # ES 集群地址（Docker 部署时注意网络连通性）
  index_novels: novels         # 小说索引名称（全文搜索用）

jwt:
  secret_key: "wenhui-novel-jwt-secret-key-2024"  # JWT 签名密钥，生产环境务必修改为强随机字符串
  algorithm: "HS256"           # JWT 签名算法（固定 HS256）
  expire_minutes: 1440         # Token 过期时间（分钟），1440=30天

deepseek:
  # API Key 不放这里：app/config.py 的 get() 里环境变量优先于本文件，
  # 部署时由 docker-compose 传入 DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
  # （值来自宿主机的 .env，.env 已在 .gitignore 中）。
  # 本地非容器运行请先 export DEEPSEEK_API_KEY=sk-xxx 再启动，否则调用会鉴权失败。
  api_key: ""
  base_url: "https://api.deepseek.com/v1/chat/completions"
  # 轻量功能（记忆体提取/剧本/概要）用 flash，省成本
  model: "deepseek-flash"
  # 章节正文生成 + 续写 + 重新生成用 pro，AI 味更淡
  model_long: "deepseek-flash"

  # 备选供应商（同样只在此保留非敏感项，key 走 DEEPSEEK_API_KEY 环境变量）
  # base_url: "https://api.xiaomimimo.com/v1/chat/completions"
  # model: "mimo-v2.5"
  # model_long: "mimo-v2.5-pro"

# AI 生成 Mock 开关（压测用）：true 时 AI 生成接口不调用真实 DeepSeek，返回固定文本
ai:
  mock_generate: false
  # 章节生成参数（字数/token/截断控制）
  generation:
    word_count: 2500           # 默认目标字数（前端创建章节时的默认值）
    word_count_max: 3000       # 前端字数输入上限（超过会提示并自动调整）
    word_count_ratio: 1.0      # prompt 要求字数上浮倍数（目标×ratio=上限，2500×1.0=2500，严格控制在2000-2500）
    max_tokens_multiplier: 1.8   # max_tokens 倍数（2500×1.8=4500，确保不截断）
    max_tokens_min: 4000       # max_tokens 下限（4000，确保写完所有概要事件）
    max_tokens_max: 6000       # max_tokens 上限（动态计算不超过此值）
    hard_cap_ratio: 1.2        # 超长截断倍数（2500×1.2=3000，硬截断上限）
    hard_cap_min_extra: 500    # 超长截断保底（2500+500=3000）
    api_timeout: 90            # 正文生成API超时（秒），90秒内必须完成
    # 采样惩罚
    frequency_penalty: 0.3
    presence_penalty: 0.3
  # 生成后程序化清洗（去 AI 检测统计特征）：true=开启，false=关闭
  # 共22条规则，两阶段执行：
  # 阶段一（全文级，含对话）：破折号/不是X是Y（逗号+句号版）/三连排比拆散/
  #   明喻词换形/"像"字密度压减/忽然突然猛地副词压减/句首连接词/那种…像引导清除
  # 阶段二（引号内对话占位保护后，句法段落级）：冒号/省略号/感叹号压减、
  #   冗余主语删除（制造无主语句）、缓冲垫短段消除、情绪标签词独立段删除（"慌乱。"）、
  #   连续短句合并、均匀段落拆段、均匀长句拆短、完全重复短句压减（烛火又跳了一下x4→留1）、
  #   标签词重复压减（烛火13次→换火苗/烛焰/灯焰）、段首主语重复去重
  # 只动标点与高频句式，不删剧情；内容层特征（"比"字密度、台词对仗、"不知道"排队）
  # 程序化管不了，靠 chapter_prompts.py 的"破内容模式"写作时规避
  text_clean:
    enabled: true

  # 生成后事实核查（反幻觉）：true=开启，false=关闭
  # 生成正文后用轻量AI调用检测是否存在记忆体中没有的事件/关系
  # 会额外消耗一次AI调用（约5-10秒），可有效防止AI编造不存在的剧情
  fact_check:
    enabled: false

  # ============================================================
  # 各 AI 调用的参数配置（统一管理，方便调优）
  # ============================================================
  api_params:
    # 正文生成（chapter_gen_graph → _call_generation_api）
    generation:
      temperature: 0.85
      top_p: 0.92
    # 续写（chapter_gen_graph → node_call_continue_api）
    continue_writing:
      max_tokens_multiplier: 2
      max_tokens_min: 1200
      max_tokens_max: 5000
      timeout: 240
      temperature: 0.85
      top_p: 0.92
      tail_chars: 2000          # 续写时读取当前章末尾多少字作为上下文
    # 事实核查（chapter_gen_graph → node_fact_check）
    fact_check_api:
      max_tokens: 1500
      timeout: 60
      temperature: 0.1
    # 记忆体提取（所有提取场景统一参数：轻量/全量/增量/发布/修复）
    extract:
      max_tokens: 8000
      timeout: 180
      temperature: 0.2
    # 大纲生成
    outline:
      timeout: 120
      temperature: 0.8
      top_p: 0.9
      frequency_penalty: 0.3
      presence_penalty: 0.2
    # 剧本生成
    script:
      max_tokens: 16384
      timeout: 300
      top_p: 0.9

