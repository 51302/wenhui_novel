services:
  elasticsearch:
    image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/elasticsearch:8.11.0
    container_name: wenhui-es
    restart: unless-stopped
    environment:
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  seaweedfs-master:
    image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/seaweedfs:latest
    container_name: wenhui-seaweedfs-master
    restart: unless-stopped
    command: master -port=9333 -ip=seaweedfs-master
    ports:
      - "9333:9333"
    volumes:
      - ./data/seaweedfs/master:/data

  seaweedfs-volume:
    image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/seaweedfs:latest
    container_name: wenhui-seaweedfs-volume
    restart: unless-stopped
    command: volume -port=8080 -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume
    ports:
      - "8080:8080"
    volumes:
      - ./data/seaweedfs/volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/seaweedfs:latest
    container_name: wenhui-seaweedfs-filer
    restart: unless-stopped
    command: filer -port=8888 -master=seaweedfs-master:9333
    ports:
      - "8888:8888"
    volumes:
      - ./data/seaweedfs/filer:/data
    depends_on:
      - seaweedfs-volume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/mysql:8.0
    container_name: wenhui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: easy-novel
      MYSQL_USER: wenhui
      MYSQL_PASSWORD: wenhui123
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./backend/app/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/redis:7-alpine
    container_name: wenhui-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/wenhui_novel-backend:v1.1.0-20260226
    container_name: wenhui-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: wenhui
      MYSQL_PASSWORD: wenhui123
      MYSQL_DATABASE: easy-novel
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      ES_HOST: http://elasticsearch:9200
      SEAWEEDFS_FILER_HOST: seaweedfs-filer
      SEAWEEDFS_FILER_PORT: "8888"
      SEAWEEDFS_FILER_PROTOCOL: http
      # 外部访问走 Natapp（HTTPS），图片通过 Nginx 代理到 SeaweedFS
      SEAWEEDFS_EXTERNAL_HOST: "wenhui.nat100.top"
      SEAWEEDFS_EXTERNAL_PORT: "443"
      SEAWEEDFS_EXTERNAL_PROTOCOL: https
      JWT_SECRET_KEY: "wenhui-novel-jwt-secret-key-2024"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      DEEPSEEK_BASE_URL: "https://api.deepseek.com"
      WEBSITE_URL: "https://wenhui.nat100.top"
      ALIPAY_NOTIFY_URL: "https://wenhui.nat100.top/api/vip/notify"
      ALIPAY_RETURN_URL: "https://wenhui.nat100.top/vip"
      TZ: "Asia/Shanghai"
    volumes:
      - ./backend/app:/app/app
      - ./data/backend/novel_structure_data:/app/app/novel_structure_data
      - ./data/backend/logs:/app/logs
      - ./backend/app/conf/config.yaml:/app/app/conf/config.yaml
    depends_on:
      mysql:
        condition: service_healthy        # ✅ 等待 MySQL 健康检查通过
      redis:
        condition: service_healthy        # ✅ 等待 Redis 健康检查通过
      elasticsearch:
        condition: service_healthy        # ✅ 等待 Elasticsearch 健康检查通过
      seaweedfs-filer:
        condition: service_healthy        # ✅ 等待 SeaweedFS Filer 健康检查通过

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # image: crpi-1xy58ppkqat4md0n.cn-hangzhou.personal.cr.aliyuncs.com/wenhui_novel/wenhui_novel-frontend:v1.1.0-20260226
    container_name: wenhui-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./data/frontend/uploads:/usr/share/nginx/html/uploads
      - ./data/frontend/covers:/usr/share/nginx/html/covers
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # Natapp 内网穿透
  natapp:
    image: natapp/natapp:latest
    container_name: wenhui-natapp
    restart: unless-stopped
    network_mode: "host"
    environment:
      - authtoken=52774ac87431feaa