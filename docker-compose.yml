# ============================================================
#  文辉小说 完整服务编排
#
#  启动: docker compose up -d
#  停止: docker compose down
#  构建: docker compose build
# ============================================================
version: "3.8"

services:
  # ==========================================
  #  MySQL 数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: wenhui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: easy-novel
      MYSQL_USER: wenhui
      MYSQL_PASSWORD: wenhui123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/app/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  #  Redis 缓存
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: wenhui-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  #  FastAPI 后端
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wenhui-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: wenhui
      MYSQL_PASSWORD: wenhui123
      MYSQL_DATABASE: easy-novel
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # JWT
      JWT_SECRET_KEY: "wenhui-novel-jwt-secret-key-2024"
      # DeepSeek AI (请在 .env 文件中配置)
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      DEEPSEEK_BASE_URL: "https://api.deepseek.com"
    volumes:
      - novel_data:/app/novel_structure_data
      - vector_data:/app/vector_db_data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  novel_data:
  vector_data:
